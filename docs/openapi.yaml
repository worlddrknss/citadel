            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/SecretsSummary"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/secrets/settings:
      get:
        operationId: getSecretSettings
        tags: [Secrets]
        summary: Get the account's secrets settings
        x-citadel-role: viewer
        responses:
          "200":
            description: Settings
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/SecretSettings"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
