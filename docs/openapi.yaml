# OpenAPI 3.1 description of Citadel's native /v1 API.
#
# Keep this file in the YAML subset that internal/server/yaml_subset_test.go
# and web/src/lib/yaml.ts parse (the repository takes no YAML dependency):
# 2-space indentation; block mappings and sequences; plain, "double" or
# 'single' quoted scalars; `|` literal blocks; flow style only for [], {} and
# one-line lists of scalars; full-line comments only; no anchors or tags.
# internal/server/openapi_test.go checks it against the registered routes.
# After editing, run `npm run generate` in sdk/typescript.
openapi: 3.1.0
info:
  title: Citadel native API
  version: 2.1.0
  summary: The protocol-clean JSON API behind the Citadel console and native SDKs
  description: |
    The native `/v1` API is the first-class Citadel API: the web console, the
    Go SDK (`sdk/citadel`) and the TypeScript SDK (`@worlddrknss/citadel`) all
    use it. It is separate from the AWS-compatible APIs (KMS, Secrets Manager,
    SSM Parameter Store, ACM, ACM PCA, STS), which keep the AWS wire protocols.

    Authentication: either a console session cookie (set by `login`), or an
    access key sent as `Authorization: Bearer <accessKeyId>:<secret>`. A bearer
    token acts with its owner's role in the key's account, never more, and never
    carries platform-admin rights. State-changing requests authenticated by the
    session cookie must also send `X-Citadel-Request: 1` (CSRF protection);
    requests with an `Authorization` header are exempt.

    Every request is scoped to the caller's current account. Each operation
    states the minimum role it needs in `x-citadel-role` (`public`, `session`,
    `viewer`, `editor`, `admin` or `platform-admin`) and, for state changes,
    the audit action it records in `x-citadel-audit`.

    Errors are JSON `{"error": "<code>", "message": "<text>"}` with a stable,
    machine-readable `error` code. Request bodies are decoded strictly: unknown
    members are rejected with `invalid_request`.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: /
    description: The Citadel server that serves this document
security:
  - sessionCookie: []
  - bearerAccessKey: []
tags:
  - name: Session
    description: Sign-in, sign-out, the current caller and first-run setup
  - name: Account
    description: Self-service for the signed-in user (access keys, password, sessions)
  - name: Projects
    description: The project, environment and folder hierarchy
  - name: Secrets
    description: Secrets stored in the hierarchy, their versions and settings
  - name: Change requests
    description: Approval workflows for protected environments
  - name: Parameters
    description: SSM-style parameters
  - name: KMS
    description: Keys, aliases, grants and cryptographic operations
  - name: Certificates
    description: Private certificate authorities and issued certificates
  - name: ACME
    description: The built-in ACME server's settings and external account binding keys
  - name: "Let's Encrypt"
    description: Public certificates from Let's Encrypt
  - name: Audit
    description: The tamper-evident audit log, export and streaming
  - name: Admin
    description: Users, accounts and organization settings
  - name: IAM
    description: OIDC providers and roles for STS identity federation
  - name: SSO
    description: Console single sign-on providers
  - name: Workload identity
    description: Citadel as an OIDC issuer for workloads
  - name: Server
    description: Server metadata and this document
paths:
    /v1/openapi.yaml:
      get:
        operationId: getOpenAPISpec
        tags: [Server]
        summary: Download this OpenAPI document
        description: |
          Returns the OpenAPI 3.1 description of the native /v1 API. It contains no
          account data, so it is served without authentication.
        x-citadel-role: public
        security: []
        responses:
          "200":
            description: The OpenAPI document
            content:
              application/yaml:
                schema:
                  type: string
    /v1/me:
      get:
        operationId: getMe
        tags: [Session]
        summary: Describe the signed-in caller
        description: |
          Returns the caller's identity and role in the current account. For an
          access-key bearer token the username is the access key ID and the role is
          the key owner's role in the key's account.
        x-citadel-role: viewer
        responses:
          "200":
            description: The caller
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Me"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
    /v1/login:
      post:
        operationId: login
        tags: [Session]
        summary: Sign in with a username and password
        description: |
          Verifies the credentials and membership of the account, then sets the
          session cookie (`__Host-citadel_session` with secure cookies, otherwise
          `citadel_session`). Requires the `X-Citadel-Request: 1` header. Attempts
          are rate limited per client address and per username (429 with
          Retry-After). Unknown users, wrong passwords and accounts the user does
          not belong to all return the same 401. When authentication is disabled
          (insecure dev mode with no users) it returns `authOff: true` and sets no
          cookie.
        x-citadel-role: public
        x-citadel-audit: [citadel.Login, citadel.LoginFailed]
        security: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginRequest"
        responses:
          "200":
            description: Signed in; the session cookie is set
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Me"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "429":
            $ref: "#/components/responses/TooManyRequests"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/logout:
      post:
        operationId: logout
        tags: [Session]
        summary: Sign out and clear the session cookie
        description: |
          Revokes the current console session, if any, and clears the cookie.
          Always succeeds. Requires the `X-Citadel-Request: 1` header.
        x-citadel-role: public
        x-citadel-audit: citadel.Logout
        security: []
        responses:
          "200":
            description: Signed out
            content:
              application/json:
                schema:
                  type: object
                  required: [loggedOut]
                  properties:
                    loggedOut:
                      type: boolean
          "403":
            $ref: "#/components/responses/Forbidden"
    /v1/session/account:
      post:
        operationId: switchAccount
        tags: [Session]
        summary: Switch the session to another account
        description: |
          Re-scopes the console session to another account the caller belongs to;
          the role is recomputed for that account. Console sessions only (an
          access-key token gets 400).
        x-citadel-role: viewer
        x-citadel-audit: citadel.SwitchAccount
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [accountId]
                properties:
                  accountId:
                    type: string
        responses:
          "200":
            description: The caller in the new account
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Me"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/me/organization:
      get:
        operationId: getMyOrganization
        tags: [Session]
        summary: Get the organization and the caller's accounts
        description: |
          Returns the organization name and each account the caller can use, with
          their role there. An access-key token sees only its own account.
        x-citadel-role: viewer
        responses:
          "200":
            description: The organization and accounts
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/MyOrganization"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
    /v1/auth/providers:
      get:
        operationId: listAuthProviders
        tags: [Session]
        summary: List the enabled single sign-on providers
        description: |
          Lists the enabled console SSO providers for the sign-in screen (IDs and
          display names only). Empty when KMS_PUBLIC_URL is not set.
        x-citadel-role: public
        security: []
        responses:
          "200":
            description: The providers
            content:
              application/json:
                schema:
                  type: object
                  required: [providers]
                  properties:
                    providers:
                      type: array
                      items:
                        $ref: "#/components/schemas/AuthProvider"
    /v1/auth/oidc/{id}/start:
      get:
        operationId: startSSOLogin
        tags: [Session]
        summary: Start a single sign-on login
        description: |
          Browser endpoint. Sets a short-lived state cookie and redirects (302) to
          the provider's authorization endpoint (OIDC authorization code flow with
          S256 PKCE). On any failure it redirects to `/app/?sso_error=<code>` where
          code is one of access_denied, no_role, state_mismatch, provider_error.
          Rate limited per client address.
        x-citadel-role: public
        x-citadel-audit: citadel.LoginSSO
        security: []
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
          - name: returnTo
            in: query
            required: false
            description: Console path to return to after sign-in (same-origin paths only)
            schema:
              type: string
        responses:
          "302":
            description: Redirect to the provider, or to the console with sso_error
    /v1/auth/oidc/{id}/callback:
      get:
        operationId: completeSSOLogin
        tags: [Session]
        summary: Complete a single sign-on login
        description: |
          Browser endpoint the provider redirects back to. Verifies state, PKCE and
          the ID token, provisions or links the console user, syncs account
          memberships from the provider's role mappings, sets the session cookie
          and redirects (302) to the requested console path. Failures redirect to
          `/app/?sso_error=<code>`.
        x-citadel-role: public
        x-citadel-audit: citadel.LoginSSO
        security: []
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
          - name: code
            in: query
            required: false
            schema:
              type: string
          - name: state
            in: query
            required: false
            schema:
              type: string
        responses:
          "302":
            description: Redirect to the console (signed in, or with sso_error)
    /v1/bootstrap:
      get:
        operationId: getBootstrapStatus
        tags: [Session]
        summary: Report whether first-run setup is needed
        x-citadel-role: public
        security: []
        responses:
          "200":
            description: Bootstrap status
            content:
              application/json:
                schema:
                  type: object
                  required: [required]
                  properties:
                    required:
                      type: boolean
      post:
        operationId: bootstrap
        tags: [Session]
        summary: Perform first-run setup
        description: |
          Creates the organization, its first account and a platform admin, then
          signs that admin in (sets the session cookie). Works only while no
          console user exists (409 `already_bootstrapped` otherwise) and needs the
          bootstrap token printed in the server log or set via configuration (401
          `invalid_bootstrap_token`). Requires the `X-Citadel-Request: 1` header.
          Rate limited per client address.
        x-citadel-role: public
        x-citadel-audit: citadel.Bootstrap
        security: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapRequest"
        responses:
          "201":
            description: Setup complete
            content:
              application/json:
                schema:
                  type: object
                  required: [accountId, organization, username]
                  properties:
                    accountId:
                      type: string
                    organization:
                      type: string
                    username:
                      type: string
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "409":
            $ref: "#/components/responses/Conflict"
          "429":
            $ref: "#/components/responses/TooManyRequests"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/server/info:
      get:
        operationId: getServerInfo
        tags: [Server]
        summary: Get public server facts
        description: |
          Reports facts the console shows before sign-in: whether the FIPS 140-3
          module is enabled and the session lifetime. The version is deliberately
          not disclosed.
        x-citadel-role: public
        security: []
        responses:
          "200":
            description: Server facts
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ServerInfo"
    /v1/account/keys:
      get:
        operationId: listAccessKeys
        tags: [Account]
        summary: List the caller's access keys
        description: Lists the caller's access keys in the current account. Secrets are never returned.
        x-citadel-role: viewer
        responses:
          "200":
            description: The access keys
            content:
              application/json:
                schema:
                  type: object
                  required: [accessKeys]
                  properties:
                    accessKeys:
                      type: array
                      items:
                        $ref: "#/components/schemas/AccessKey"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
      post:
        operationId: createAccessKey
        tags: [Account]
        summary: Create an access key
        description: |
          Mints an access key for the caller in the current account. The secret is
          returned exactly once. Use it as a bearer token
          `Authorization: Bearer <accessKeyId>:<secretKey>` on /v1, or as AWS
          credentials (SigV4) on the AWS-compatible APIs. No request body.
        x-citadel-role: viewer
        x-citadel-audit: citadel.CreateAccessKey
        responses:
          "200":
            description: The new key and its secret
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/CreatedAccessKey"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
      delete:
        operationId: deleteAccessKey
        tags: [Account]
        summary: Delete an access key
        description: |
          Deletes one of the caller's keys. Admins may delete other users' keys in
          their account (platform admins in any account).
        x-citadel-role: viewer
        x-citadel-audit: citadel.DeleteAccessKey
        parameters:
          - name: accessKeyId
            in: query
            required: true
            schema:
              type: string
        responses:
          "200":
            description: Deleted
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/DeletedFlag"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/account/keys/status:
      post:
        operationId: setAccessKeyStatus
        tags: [Account]
        summary: Activate or deactivate an access key
        description: |
          Same ownership rules as deleteAccessKey. An inactive key is refused on
          every API until reactivated.
        x-citadel-role: viewer
        x-citadel-audit: citadel.SetAccessKeyStatus
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetAccessKeyStatusRequest"
        responses:
          "200":
            description: The new status
            content:
              application/json:
                schema:
                  type: object
                  required: [accessKeyId, status]
                  properties:
                    accessKeyId:
                      type: string
                    status:
                      type: string
                      enum: [Active, Inactive]
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/account/password:
      post:
        operationId: changePassword
        tags: [Account]
        summary: Change the caller's password
        description: |
          Verifies the current password (403 when wrong) and sets a new one of at
          least 8 characters. Ends the caller's other sessions. Console sessions
          only: access-key tokens get 403.
        x-citadel-role: session
        x-citadel-audit: citadel.ChangePassword
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordRequest"
        responses:
          "200":
            description: Updated
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/UpdatedFlag"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/account/profile:
      post:
        operationId: updateProfile
        tags: [Account]
        summary: Update the caller's display name
        description: |
          Console sessions only. Users defined in the server configuration cannot
          be changed here (409 `managed_by_config`).
        x-citadel-role: session
        x-citadel-audit: citadel.UpdateProfile
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [displayName]
                properties:
                  displayName:
                    type: string
                    maxLength: 100
        responses:
          "200":
            description: The updated profile
            content:
              application/json:
                schema:
                  type: object
                  required: [username, displayName]
                  properties:
                    username:
                      type: string
                    displayName:
                      type: string
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/account/sessions:
      get:
        operationId: listSessions
        tags: [Account]
        summary: List the caller's live sessions
        description: |
          Console sessions only. expiresAt is the earlier of the absolute and idle
          deadlines.
        x-citadel-role: session
        responses:
          "200":
            description: The sessions
            content:
              application/json:
                schema:
                  type: object
                  required: [sessions]
                  properties:
                    sessions:
                      type: array
                      items:
                        $ref: "#/components/schemas/ConsoleSession"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
      delete:
        operationId: revokeSession
        tags: [Account]
        summary: Sign out one of the caller's other sessions
        description: Console sessions only. The current session cannot be revoked here; use logout.
        x-citadel-role: session
        x-citadel-audit: citadel.RevokeSession
        parameters:
          - name: id
            in: query
            required: true
            schema:
              type: string
              maxLength: 64
        responses:
          "200":
            description: Revoked
            content:
              application/json:
                schema:
                  type: object
                  required: [revoked]
                  properties:
                    revoked:
                      type: boolean
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/account/sessions/revoke-others:
      post:
        operationId: revokeOtherSessions
        tags: [Account]
        summary: Sign out every other session of the caller
        description: Console sessions only.
        x-citadel-role: session
        x-citadel-audit: citadel.RevokeSession
        responses:
          "200":
            description: The number of sessions revoked
            content:
              application/json:
                schema:
                  type: object
                  required: [revoked]
                  properties:
                    revoked:
                      type: integer
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/admin/users:
      get:
        operationId: listUsers
        tags: [Admin]
        summary: List console users
        description: |
          Platform admins see every user and membership. Account admins see only
          the members of their account, with only that membership, and role is the
          account role.
        x-citadel-role: admin
        responses:
          "200":
            description: The users
            content:
              application/json:
                schema:
                  type: object
                  required: [users]
                  properties:
                    users:
                      type: array
                      items:
                        $ref: "#/components/schemas/ConsoleUser"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
      post:
        operationId: upsertUser
        tags: [Admin]
        summary: Create or update a console user
        description: |
          Platform admins set the global role, the accounts and optionally the
          platformAdmin flag. Account admins create users into their own account
          (role sets the account role) and may update only users who belong to
          their account alone; they cannot set platformAdmin or other accounts.
          A password is required for a new user (8 or more characters); resetting
          an existing user's password ends their sessions.
        x-citadel-role: admin
        x-citadel-audit: citadel.UpsertUser
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertUserRequest"
        responses:
          "200":
            description: Saved
            content:
              application/json:
                schema:
                  type: object
                  required: [username, created]
                  properties:
                    username:
                      type: string
                    created:
                      type: boolean
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
      delete:
        operationId: deleteUser
        tags: [Admin]
        summary: Delete a console user
        description: Removes the user with their sessions and memberships. You cannot delete yourself.
        x-citadel-role: admin
        x-citadel-audit: citadel.DeleteUser
        parameters:
          - name: username
            in: query
            required: true
            schema:
              type: string
        responses:
          "200":
            description: Deleted
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/DeletedFlag"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/admin/accounts:
      get:
        operationId: listAccounts
        tags: [Admin]
        summary: List accounts
        description: Every account for platform admins; the caller's own accounts otherwise.
        x-citadel-role: admin
        responses:
          "200":
            description: The accounts
            content:
              application/json:
                schema:
                  type: object
                  required: [accounts]
                  properties:
                    accounts:
                      type: array
                      items:
                        $ref: "#/components/schemas/Account"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
      post:
        operationId: createAccount
        tags: [Admin]
        summary: Create an account
        description: Creates an account and provisions its default KMS key (alias/default).
        x-citadel-role: platform-admin
        x-citadel-audit: citadel.CreateAccount
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties:
                  name:
                    type: string
                    description: 1-63 letters, digits, spaces, dots, dashes or underscores
        responses:
          "200":
            description: Created
            content:
              application/json:
                schema:
                  type: object
                  required: [accountId, created]
                  properties:
                    accountId:
                      type: string
                    created:
                      type: boolean
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
      delete:
        operationId: deleteAccount
        tags: [Admin]
        summary: Delete an account
        description: You cannot delete the account you are signed into.
        x-citadel-role: platform-admin
