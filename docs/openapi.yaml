          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
    /v1/kms/keys/detail:
      get:
        operationId: getKmsKey
        tags: [KMS]
        summary: Get a KMS key's full metadata
        description: |
          State, algorithms, the default key policy, aliases, grants, usage counts
          and, for asymmetric keys, the public key in PEM form.
        x-citadel-role: viewer
        parameters:
          - name: keyId
            in: query
            required: true
            description: Key ID, key ARN or alias
            schema:
              type: string
        responses:
          "200":
            description: The key
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/KmsKeyDetail"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    /v1/kms/keys/policy:
      post:
        operationId: putKmsKeyPolicy
        tags: [KMS]
        summary: Replace a KMS key's default policy
        x-citadel-role: editor
        x-citadel-audit: citadel.PutKeyPolicy
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsPutPolicyRequest"
        responses:
          "200":
            description: The policy was saved
            content:
              application/json:
                schema:
                  type: object
                  required: [keyId, saved]
                  properties:
                    keyId:
                      type: string
                    saved:
                      type: boolean
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    /v1/kms/aliases:
      post:
        operationId: createKmsAlias
        tags: [KMS]
        summary: Create an alias for a KMS key
        description: |
          The `alias/` prefix is added when missing; the `alias/aws/` prefix is
          reserved.
        x-citadel-role: editor
        x-citadel-audit: citadel.CreateAlias
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsAliasRequest"
        responses:
          "200":
            description: The alias was created
            content:
              application/json:
                schema:
                  type: object
                  required: [aliasName, keyId, created]
                  properties:
                    aliasName:
                      type: string
                    keyId:
                      type: string
                    created:
                      type: boolean
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
      delete:
        operationId: deleteKmsAlias
        tags: [KMS]
        summary: Delete a KMS alias
        x-citadel-role: editor
        x-citadel-audit: citadel.DeleteAlias
        parameters:
          - name: aliasName
            in: query
            required: true
            description: The alias, with or without the `alias/` prefix
            schema:
              type: string
        responses:
          "200":
            description: The alias was deleted
            content:
              application/json:
                schema:
                  type: object
                  required: [aliasName, deleted]
                  properties:
                    aliasName:
                      type: string
                    deleted:
                      type: boolean
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    /v1/kms/aliases/update:
      post:
        operationId: updateKmsAlias
        tags: [KMS]
        summary: Point an existing alias at another key
        x-citadel-role: editor
        x-citadel-audit: citadel.UpdateAlias
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsAliasRequest"
        responses:
          "200":
            description: The alias was retargeted
            content:
              application/json:
                schema:
                  type: object
                  required: [aliasName, keyId, updated]
                  properties:
                    aliasName:
                      type: string
                    keyId:
                      type: string
                    updated:
                      type: boolean
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
    /v1/kms/grants:
      post:
        operationId: createKmsGrant
        tags: [KMS]
        summary: Create a grant on a KMS key
        description: |
          Principals must be IAM principal ARNs without wildcards; operations must
          suit the key's usage and spec.
        x-citadel-role: editor
        x-citadel-audit: kms.CreateGrant
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsCreateGrantRequest"
        responses:
          "200":
            description: The new grant
            content:
              application/json:
                schema:
                  type: object
                  required: [grantId, grantToken]
                  properties:
                    grantId:
                      type: string
                    grantToken:
                      type: string
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
      delete:
        operationId: revokeKmsGrant
        tags: [KMS]
        summary: Revoke a grant on a KMS key
        x-citadel-role: editor
        x-citadel-audit: kms.RevokeGrant
        parameters:
          - name: keyId
            in: query
            required: true
            schema:
              type: string
          - name: grantId
            in: query
            required: true
            schema:
              type: string
              maxLength: 128
        responses:
          "200":
            description: The grant was revoked
            content:
              application/json:
                schema:
                  type: object
                  required: [revoked]
                  properties:
                    revoked:
                      type: boolean
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/kms/keys/rotation:
      get:
        operationId: getKmsKeyRotation
        tags: [KMS]
        summary: Get a key's automatic rotation status and history
        x-citadel-role: viewer
        parameters:
          - name: keyId
            in: query
            required: true
            schema:
              type: string
        responses:
          "200":
            description: The rotation status
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/KmsRotationStatus"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
      post:
        operationId: setKmsKeyRotation
        tags: [KMS]
        summary: Enable or disable automatic rotation
        description: |
          Symmetric keys only (400 `unsupported` otherwise). `rotationPeriodDays`
          is 90-2560; 0 or omitted uses the default of 365. A disabled or
          pending-deletion key returns 409 `invalid_state`.
        x-citadel-role: editor
        x-citadel-audit: [kms.EnableKeyRotation, kms.DisableKeyRotation]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsSetRotationRequest"
        responses:
          "200":
            description: The updated rotation status
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/KmsRotationStatus"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/kms/keys/rotate:
      post:
        operationId: rotateKmsKey
        tags: [KMS]
        summary: Rotate a symmetric key's material now
        description: Older material stays available to decrypt existing ciphertext.
        x-citadel-role: editor
        x-citadel-audit: kms.RotateKeyOnDemand
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsKeyIdRequest"
        responses:
          "200":
            description: The updated rotation status
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/KmsRotationStatus"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/kms/keys/tags:
      get:
        operationId: listKmsKeyTags
        tags: [KMS]
        summary: List a KMS key's tags
        x-citadel-role: viewer
        parameters:
          - name: keyId
            in: query
            required: true
            schema:
              type: string
        responses:
          "200":
            description: The key's tags
            content:
              application/json:
                schema:
                  type: object
                  required: [keyId, tags]
                  properties:
                    keyId:
                      type: string
                    tags:
                      type: array
                      items:
                        $ref: "#/components/schemas/Tag"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
      post:
        operationId: tagKmsKey
        tags: [KMS]
        summary: Add or update tags on a KMS key
        x-citadel-role: editor
        x-citadel-audit: kms.TagResource
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsTagRequest"
        responses:
          "200":
            description: Tags saved
            content:
              application/json:
                schema:
                  type: object
                  required: [tagged]
                  properties:
                    tagged:
                      type: boolean
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
      delete:
        operationId: untagKmsKey
        tags: [KMS]
        summary: Remove a tag from a KMS key
        x-citadel-role: editor
        x-citadel-audit: kms.UntagResource
        parameters:
          - name: keyId
            in: query
            required: true
            schema:
              type: string
          - name: tagKey
            in: query
            required: true
            description: The single tag key to remove
            schema:
              type: string
        responses:
          "200":
            description: The tag was removed
            content:
              application/json:
                schema:
                  type: object
                  required: [untagged]
                  properties:
                    untagged:
                      type: boolean
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/kms/encrypt:
      post:
        operationId: kmsEncrypt
        tags: [KMS]
        summary: Encrypt data with a KMS key
        description: |
          `plaintext` is base64 (1-4096 bytes decoded for symmetric keys; RSA keys
          take RSAES_OAEP_SHA_256 and no encryption context). The response's
          `ciphertextBlob` is base64. A disabled key returns 409 `key_disabled`.
        x-citadel-role: editor
        x-citadel-audit: kms.Encrypt
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsEncryptRequest"
        responses:
          "200":
            description: The ciphertext
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/KmsEncryptResponse"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/kms/decrypt:
      post:
        operationId: kmsDecrypt
        tags: [KMS]
        summary: Decrypt data with a KMS key
        description: |
          `keyId` is required. `ciphertextBlob` is base64; the response's
          `plaintext` is base64. The encryption context must match the one used
          to encrypt (400 `invalid_ciphertext` otherwise).
        x-citadel-role: editor
        x-citadel-audit: kms.Decrypt
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsDecryptRequest"
        responses:
          "200":
            description: The plaintext
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/KmsDecryptResponse"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/kms/sign:
      post:
        operationId: kmsSign
        tags: [KMS]
        summary: Sign a message with an asymmetric KMS key
        description: |
          SIGN_VERIFY keys only. `signingAlgorithm` is required and must be valid
          for the key; `messageType` is RAW or DIGEST; `message` is 1-4096 bytes,
          base64. A DIGEST must be exactly one hash long. `signature` must not be
          sent. The response's `signature` is base64.
        x-citadel-role: editor
        x-citadel-audit: kms.Sign
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsSignRequest"
        responses:
          "200":
            description: The signature
            content:
              application/json:
                schema:
                  type: object
                  required: [keyId, signature, signingAlgorithm]
                  properties:
                    keyId:
                      type: string
                    signature:
                      type: string
                      format: byte
                    signingAlgorithm:
                      type: string
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/kms/verify:
      post:
        operationId: kmsVerify
        tags: [KMS]
        summary: Verify a signature with an asymmetric KMS key
        description: |
          Same inputs as kmsSign plus a base64 `signature`. An invalid signature
          is a 200 with `signatureValid` false.
        x-citadel-role: editor
        x-citadel-audit: kms.Verify
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsSignRequest"
        responses:
          "200":
            description: The verification result
            content:
              application/json:
                schema:
                  type: object
                  required: [keyId, signatureValid, signingAlgorithm]
                  properties:
                    keyId:
                      type: string
                    signatureValid:
                      type: boolean
                    signingAlgorithm:
                      type: string
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/kms/admin/rewrap:
      post:
        operationId: rewrapKmsKeyMaterial
        tags: [KMS]
        summary: Re-wrap all stored material onto the current wrapping key
        description: |
          Deployment-wide, so platform admins only. Takes no request body.
          Returns counts of what was scanned and re-wrapped.
        x-citadel-role: platform-admin
        x-citadel-audit: citadel.RewrapKeyMaterial
        responses:
          "200":
            description: The re-wrap report
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/KmsRewrapReport"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/certificates:
      get:
        operationId: listCertificates
        tags: [Certificates]
        summary: List certificate authorities and certificates
        description: |
          Returns every private CA in the caller's account, each followed by the
          certificates it issued, then the account's Let's Encrypt certificates,
          in one flat unpaginated list. Rows are told apart by `source`
          (`pca-ca`, `pca-cert`, `lets-encrypt`). An issued certificate past its
          notAfter is reported as EXPIRED even before the expiry job has run.
        x-citadel-role: viewer
        responses:
          "200":
            description: The account's certificates
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/CertificateList"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
          "501":
            description: The configured store does not support this operation (`unsupported`)
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
    /v1/certificates/authorities:
      post:
        operationId: createCertificateAuthority
        tags: [Certificates]
        summary: Create a root or subordinate CA
        description: |
          Creates a ROOT CA (the default), or a SUBORDINATE CA signed by
          `parentCaId`. The CA key is generated in Citadel's KMS. `parentCaId`
          is rejected for ROOT CAs and required for SUBORDINATE ones.
        x-citadel-role: admin
        x-citadel-audit: citadel.CreateCA
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateCreateCARequest"
        responses:
          "200":
            description: The CA was created
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/CertificateCreateCAResponse"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/certificates/authorities/import:
      post:
        operationId: importCertificateAuthority
        tags: [Certificates]
        summary: Import an external CA certificate and key
        description: |
          Stores an externally generated CA certificate (CA:TRUE with
          keyCertSign) and its unencrypted PEM private key, which must match.
          A certificate that is not self-signed is recorded as SUBORDINATE, with
          its parent set when one of the account's CAs signed it.
        x-citadel-role: admin
        x-citadel-audit: citadel.ImportCA
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateImportCARequest"
        responses:
          "200":
            description: The CA was imported
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/CertificateImportCAResponse"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/certificates/issue:
      post:
        operationId: issueCertificate
        tags: [Certificates]
        summary: Sign a CSR with a private CA
        description: |
          Signs the PEM CSR with the CA named by `caArn` (a CA ID or ARN). The
          response carries only the new certificate ID; fetch the PEM with
          getCertificate (source `pca-cert`).
        x-citadel-role: editor
        x-citadel-audit: citadel.IssueCertificate
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssueRequest"
        responses:
          "200":
            description: The certificate was issued
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/CertificateIssueResponse"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/certificates/issue/generate:
      post:
        operationId: issueGeneratedCertificate
        tags: [Certificates]
        summary: Issue a certificate with a key generated by Citadel
        description: |
          Generates the key pair inside Citadel, issues a certificate for it from
          the CA `caId`, and returns the private key once (Cache-Control:
          no-store). The private key is never stored or logged.
        x-citadel-role: editor
        x-citadel-audit: citadel.IssueCertificate
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateGenerateRequest"
        responses:
          "200":
            description: The certificate, its chain and the private key
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/CertificateGenerateResponse"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/certificates/renew:
      post:
        operationId: renewCertificate
        tags: [Certificates]
        summary: Renew an issued certificate
        description: |
          Re-signs the certificate's stored CSR from the same CA and template with
          a new serial and validity window, keeping the issued names. Revoked
          certificates, and certificates without a usable stored CSR, return 409
          `conflict`.
        x-citadel-role: editor
        x-citadel-audit: citadel.RenewCertificate
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateRenewRequest"
        responses:
          "200":
            description: The renewed certificate's new ID
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/CertificateRenewResponse"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/certificates/revoke:
      post:
        operationId: revokeCertificate
        tags: [Certificates]
        summary: Revoke an issued certificate
        description: |
          Revokes a certificate issued by a private CA; it then appears on the
          CA's CRL. Revoking twice returns 409 `conflict`.
        x-citadel-role: admin
        x-citadel-audit: citadel.RevokeCertificate
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateRevokeRequest"
        responses:
          "200":
            description: The certificate was revoked
            content:
              application/json:
                schema:
                  type: object
                  required: [revoked]
                  properties:
                    revoked:
                      type: boolean
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/certificates/detail:
      get:
        operationId: getCertificate
        tags: [Certificates]
        summary: Get one certificate's metadata and PEM
        description: |
          Returns the full metadata and PEM material of a CA (`pca-ca`), an
          issued certificate (`pca-cert`) or a Let's Encrypt certificate
          (`lets-encrypt`). For an issued certificate `chainPem` is the issuing
          CA's certificate; for a CA it is the CA certificate itself.
        x-citadel-role: viewer
        parameters:
          - name: source
            in: query
            required: true
            schema:
              type: string
              enum: [pca-ca, pca-cert, lets-encrypt]
          - name: id
            in: query
            required: true
            description: The CA ID or certificate ID from listCertificates
            schema:
              type: string
        responses:
          "200":
            description: The certificate
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/CertificateDetail"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/certificates/letsencrypt/settings:
      get:
        operationId: getLetsEncryptSettings
        tags:
          - "Let's Encrypt"
        summary: Get the Let's Encrypt directory and contact email
        x-citadel-role: viewer
        responses:
          "200":
            description: The Let's Encrypt settings
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/LetsEncryptSettings"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
      post:
        operationId: saveLetsEncryptSettings
        tags:
          - "Let's Encrypt"
        summary: Save the Let's Encrypt directory and contact email
        description: |
          Deployment-wide setting. `environment` selects the staging (default) or
          production Let's Encrypt directory, or `custom` with an https
          `directoryUrl`. Requires the database-backed store (501 otherwise).
        x-citadel-role: admin
        x-citadel-audit: citadel.SaveLESettings
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetsEncryptSettingsRequest"
        responses:
          "200":
            description: The settings were saved
            content:
              application/json:
                schema:
                  type: object
                  required: [saved]
                  properties:
                    saved:
                      type: boolean
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
          "501":
            description: Requires a database-backed store (`unsupported`)
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
    /v1/certificates/letsencrypt/request:
      post:
        operationId: requestLetsEncryptCertificate
        tags:
          - "Let's Encrypt"
        summary: Start HTTP-01 Let's Encrypt issuance
        description: |
          Creates an order and starts issuance in the background, returning 202
          with the order to poll with getLetsEncryptOrder. Wildcard names need
          DNS-01. The audit event is recorded when the order finishes (`ok` with
          the certificate ID, or `error`). Requires the database-backed store.
        x-citadel-role: editor
        x-citadel-audit: citadel.RequestLetsEncrypt
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetsEncryptDomainsRequest"
        responses:
          "202":
            description: Issuance started
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/LetsEncryptRequestResponse"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "501":
            description: Requires a database-backed store (`unsupported`)
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
          "502":
            description: The ACME exchange failed (`letsencrypt_failed`)
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
    /v1/certificates/letsencrypt/dns/begin:
      post:
        operationId: beginLetsEncryptDnsOrder
        tags:
          - "Let's Encrypt"
        summary: Start a manual DNS-01 Let's Encrypt order
        description: |
          Creates the ACME order and returns the TXT records to publish. Call
          completeLetsEncryptDnsOrder once they have propagated. Requires the
          database-backed store.
        x-citadel-role: editor
        x-citadel-audit: citadel.BeginLetsEncryptDNS
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetsEncryptDomainsRequest"
        responses:
          "200":
            description: The order and the TXT records to publish
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/LetsEncryptDnsBeginResponse"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "501":
            description: Requires a database-backed store (`unsupported`)
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
          "502":
            description: The ACME exchange failed (`letsencrypt_failed`)
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
    /v1/certificates/letsencrypt/dns/complete:
      post:
        operationId: completeLetsEncryptDnsOrder
        tags:
          - "Let's Encrypt"
        summary: Validate and finalize a DNS-01 order
        description: |
          Starts validation of the published TXT records and finalization in the
          background and returns 202 with the order to poll. A failed order can be
          retried; an order already processing or issued is reported as is. Other
          states return 409 `order_conflict`. The audit event is recorded when the
          order finishes.
        x-citadel-role: editor
        x-citadel-audit: citadel.CompleteLetsEncryptDNS
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetsEncryptDnsCompleteRequest"
        responses:
          "202":
            description: Validation started (or already running or done)
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/LetsEncryptOrder"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
          "501":
            description: Requires a database-backed store (`unsupported`)
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
          "502":
            description: The ACME exchange failed (`letsencrypt_failed`)
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
    /v1/certificates/letsencrypt/orders:
      get:
        operationId: getLetsEncryptOrder
        tags:
          - "Let's Encrypt"
        summary: Get a Let's Encrypt order's status
        description: |
          Poll until `status` is `issued` (then `certId` is set) or `failed` (then
          `error` explains why). A processing order whose replica stopped is
          reported as failed once it is older than the order timeout.
        x-citadel-role: viewer
        parameters:
          - name: id
            in: query
            required: true
            description: The order ID (at most 64 characters)
            schema:
              type: string
              maxLength: 64
        responses:
          "200":
            description: The order
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/LetsEncryptOrder"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "501":
            description: Requires a database-backed store (`unsupported`)
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
    /v1/certificates/acme/eab:
      get:
        operationId: listAcmeEabKeys
        tags: [ACME]
        summary: List ACME External Account Binding keys
        description: The HMAC secrets are never returned after creation.
        x-citadel-role: viewer
        responses:
          "200":
            description: The account's EAB keys
            content:
              application/json:
                schema:
                  type: object
                  required: [keys]
                  properties:
                    keys:
                      type: array
                      items:
                        $ref: "#/components/schemas/AcmeEabKey"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
      post:
        operationId: createAcmeEabKey
        tags: [ACME]
        summary: Create an ACME External Account Binding key
        description: |
          Returns the key ID and its base64url HMAC key once (Cache-Control:
          no-store). An ACME client binds a new account with them; each key binds
          one account.
        x-citadel-role: admin
        x-citadel-audit: citadel.CreateEABKey
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [label]
                properties:
                  label:
                    type: string
                    maxLength: 128
                    description: One line, at most 128 characters
        responses:
          "200":
            description: The new key, including its HMAC secret
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/AcmeEabKeyCreated"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
      delete:
        operationId: revokeAcmeEabKey
        tags: [ACME]
        summary: Revoke an ACME External Account Binding key
        description: Revoking a key also deactivates the ACME account it bound.
        x-citadel-role: admin
        x-citadel-audit: citadel.RevokeEABKey
        parameters:
          - name: kid
            in: query
            required: true
            schema:
              type: string
        responses:
          "200":
            description: The key was revoked
            content:
              application/json:
                schema:
                  type: object
                  required: [kid, revoked]
                  properties:
                    kid:
                      type: string
                    revoked:
                      type: boolean
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/certificates/acme/settings:
      get:
        operationId: getAcmeSettings
        tags: [ACME]
        summary: Get the ACME server settings
        description: |
          `enabled` is true when a public URL is configured; then `directoryUrl`
          is the ACME directory clients use.
        x-citadel-role: viewer
        responses:
          "200":
            description: The ACME server settings
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/AcmeSettings"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
      post:
        operationId: putAcmeSettings
        tags: [ACME]
        summary: Update the ACME server settings
        description: |
          Sets the issuing CA (must be ACTIVE) and the allow lists: domains
          (e.g. example.com, no wildcards), IP ranges clients may request, and
          CIDRs validation may connect to. At most 200 entries per list. Returns
          the saved settings.
        x-citadel-role: admin
        x-citadel-audit: citadel.PutACMESettings
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcmeSettingsRequest"
        responses:
          "200":
            description: The saved settings
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/AcmeSettings"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/audit:
      get:
        operationId: listRecentAuditEvents
        tags: [Audit]
        summary: List the 500 most recent audit events
        description: |
          A short, unfiltered summary of the newest events in the caller's
          account. Use listAuditEvents for filtering and paging.
        x-citadel-role: viewer
        responses:
          "200":
            description: The most recent events, newest first
            content:
              application/json:
                schema:
                  type: object
                  required: [events]
                  properties:
                    events:
                      type: array
                      items:
                        $ref: "#/components/schemas/AuditEventSummary"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/audit/events:
      get:
        operationId: listAuditEvents
        tags: [Audit]
        summary: Query audit events
        description: Filtered, offset-paginated listing of the caller account's audit log, newest first.
        x-citadel-role: viewer
        parameters:
          - name: from
            in: query
            required: false
            description: Earliest event time (RFC 3339)
            schema:
              type: string
              format: date-time
          - name: to
            in: query
            required: false
            description: Latest event time (RFC 3339); not before from
            schema:
              type: string
              format: date-time
          - name: actor
            in: query
            required: false
            description: Actor filter (at most 256 characters)
            schema:
              type: string
              maxLength: 256
          - name: action
            in: query
            required: false
            description: Action filter, e.g. citadel.PutItem (at most 256 characters)
            schema:
              type: string
              maxLength: 256
          - name: resource
            in: query
            required: false
            description: Resource filter (at most 256 characters)
            schema:
              type: string
              maxLength: 256
          - name: result
            in: query
            required: false
            description: Outcome filter
            schema:
              type: string
              enum: [success, denied, error]
          - name: limit
            in: query
            required: false
            schema:
              type: integer
              minimum: 1
              maximum: 500
              default: 50
          - name: offset
            in: query
            required: false
            schema:
              type: integer
              minimum: 0
              maximum: 100000
              default: 0
        responses:
          "200":
            description: One page of events
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/AuditEventPage"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/audit/verify:
      get:
        operationId: getAuditChainStatus
        tags: [Audit]
        summary: Get the last audit chain verification result
        x-citadel-role: viewer
        responses:
          "200":
            description: The last verification result
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/AuditChainStatus"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
      post:
        operationId: verifyAuditChain
        tags: [Audit]
        summary: Verify the audit hash chain
        description: |
          Verifies the account's chain from the last verified point (or from the
          start after a break) and returns the result. `full=true` re-walks the
          whole chain and needs a platform admin signed in with a console session
          (bearer tokens are refused).
        x-citadel-role: viewer
        x-citadel-audit: citadel.VerifyAuditChain
        parameters:
          - name: full
            in: query
            required: false
            description: Re-walk the whole chain (platform admins only)
            schema:
              type: boolean
        responses:
          "200":
            description: The verification result
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/AuditChainStatus"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/audit/export:
      get:
        operationId: exportAuditEvents
        tags: [Audit]
        summary: Export audit events as CSV or JSON
        description: |
          Streams every matching event (at most 100000; more returns 400
          `export_too_large`) as a file download (Cache-Control: no-store). The
          export is pinned to the events that existed when it started. Limited
          to 5 exports per minute per user and account (429 `rate_limited` with
          Retry-After). Fails closed: if the audit record of the export cannot be
          written, the export is refused (500 `audit_unavailable`). CSV cells
          that start with a formula trigger are prefixed with a single quote.
        x-citadel-role: viewer
        x-citadel-audit: citadel.ExportAudit
        parameters:
          - name: format
            in: query
            required: false
            schema:
              type: string
              enum: [csv, json]
              default: csv
          - name: from
            in: query
            required: false
            description: Earliest event time (RFC 3339)
            schema:
              type: string
              format: date-time
          - name: to
            in: query
            required: false
            description: Latest event time (RFC 3339); not before from
            schema:
              type: string
              format: date-time
          - name: actor
            in: query
            required: false
            description: Actor filter (at most 256 characters)
            schema:
              type: string
              maxLength: 256
          - name: action
            in: query
            required: false
            description: Action filter, e.g. citadel.PutItem (at most 256 characters)
            schema:
              type: string
              maxLength: 256
          - name: resource
            in: query
            required: false
            description: Resource filter (at most 256 characters)
            schema:
              type: string
              maxLength: 256
          - name: result
            in: query
            required: false
            description: Outcome filter
            schema:
              type: string
              enum: [success, denied, error]
        responses:
          "200":
            description: The export file
            content:
              text/csv:
                schema:
                  type: string
                  description: |
                    Header row id, createdAt, actor, actorType, actorDisplayName,
                    accessKeyId, action, resource, keyId, result, errorType,
                    sourceIp, userAgent, chainSeq, prevHash, hash; CRLF line ends.
              application/json:
                schema:
                  type: array
                  items:
                    $ref: "#/components/schemas/AuditEvent"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "429":
            $ref: "#/components/responses/TooManyRequests"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/audit/stream:
      get:
        operationId: getAuditStream
        tags: [Audit]
        summary: Get the SIEM stream settings
        description: The webhook token is never returned; `hasToken` says whether one is stored.
        x-citadel-role: viewer
        responses:
          "200":
            description: The stream settings
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/AuditStream"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
      post:
        operationId: putAuditStream
        tags: [Audit]
        summary: Configure the SIEM stream
        description: |
          Sets the webhook that receives the account's audit events. The URL must
          be an absolute https URL without credentials or fragment (required when
          enabled). An omitted `token` keeps the stored one; an empty string
          clears it. The token is sealed at rest.
        x-citadel-role: admin
        x-citadel-audit: citadel.PutAuditStream
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditStreamRequest"
        responses:
          "200":
            description: The saved settings
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/AuditStream"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/audit/stream/test:
      post:
        operationId: testAuditStream
        tags: [Audit]
        summary: Send a test event to the SIEM stream
        description: |
          Sends one synthetic event to the configured webhook now. A delivery
          failure is still a 200 with `delivered: false`. Returns 400
          `stream_not_configured` when no URL is set.
        x-citadel-role: admin
        x-citadel-audit: citadel.TestAuditStream
        responses:
          "200":
            description: The delivery outcome
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/AuditStreamTestResult"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-citadel_session
      description: |
        The console session cookie set by `login` (named `citadel_session`
        when secure cookies are disabled). State-changing requests that rely
        on it must send `X-Citadel-Request: 1`.
    bearerAccessKey:
      type: http
      scheme: bearer
      bearerFormat: "<accessKeyId>:<secret>"
      description: An access key created with createAccessKey, sent as `Bearer <accessKeyId>:<secret>`.
  responses:
    BadRequest:
      description: The request was invalid (`invalid_request` or an operation-specific code)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is missing, expired or invalid (`unauthorized`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller lacks the required role (`forbidden`), or a cookie write lacked `X-Citadel-Request` (`csrf_rejected`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist in the caller's account (`not_found`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with current state (for example `approval_required` or `conflict`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited (`rate_limited`); retry later
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: The server failed (`internal_error` or an operation-specific code); details are logged, not returned
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      description: The error body every native endpoint returns
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable code, e.g. `invalid_request`, `not_found`, `forbidden`
        message:
          type: string
          description: Human-readable explanation
    Tag:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string
    OkFlag:
      type: object
      description: "A small acknowledgement object, such as {\"deleted\": true}"
      additionalProperties: true
    DeletedFlag:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
    UpdatedFlag:
      type: object
      required: [updated]
      properties:
        updated:
          type: boolean
    Me:
      type: object
      required: [username, displayName, role, accountId, accounts, platformAdmin]
      properties:
        username:
          type: string
          description: Console username, or the access key ID for a bearer token
        displayName:
          type: string
        role:
          type: string
          enum: [viewer, editor, admin]
        accountId:
          type: string
        accounts:
          type: array
          items:
            type: string
        platformAdmin:
          type: boolean
        authOff:
          type: boolean
          description: Set by login only, when authentication is disabled (insecure dev mode)
    LoginRequest:
      type: object
      required: [accountId, username, password]
      properties:
        accountId:
          type: string
          maxLength: 64
        username:
          type: string
          maxLength: 128
        password:
          type: string
          maxLength: 1024
    BootstrapRequest:
      type: object
      required: [organizationName, accountName, username, password, bootstrapToken]
      properties:
        organizationName:
          type: string
          maxLength: 100
        accountName:
          type: string
          description: 1-63 letters, digits, spaces, dots, dashes or underscores
        username:
          type: string
          description: 1-64 letters, digits, dots, dashes, underscores or @
        password:
          type: string
          minLength: 12
          maxLength: 1024
        bootstrapToken:
          type: string
    ServerInfo:
      type: object
      required: [fips, sessionMaxHours]
      properties:
        fips:
          type: boolean
          description: Whether the FIPS 140-3 Go Cryptographic Module is enabled
        sessionMaxHours:
          type: integer
        sessionIdleMinutes:
          type: integer
          description: Present when an idle timeout applies
    AuthProvider:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [oidc]
    MyOrganization:
      type: object
      required: [organization, accounts]
      properties:
        organization:
          type: object
          required: [name]
          properties:
            name:
              type: string
        accounts:
          type: array
          items:
            type: object
            required: [accountId, name]
            properties:
              accountId:
                type: string
              name:
                type: string
              role:
                type: string
                enum: [viewer, editor, admin]
    AccessKey:
      type: object
      required: [accessKeyId, status, createdAt]
      properties:
        accessKeyId:
          type: string
        status:
          type: string
          enum: [Active, Inactive]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    CreatedAccessKey:
      type: object
      required: [accessKeyId, secretKey]
      properties:
        accessKeyId:
          type: string
        secretKey:
          type: string
          description: Returned only once
    SetAccessKeyStatusRequest:
      type: object
      required: [accessKeyId, status]
      properties:
        accessKeyId:
          type: string
        status:
          type: string
          enum: [Active, Inactive]
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 1024
    ConsoleSession:
      type: object
      required: [id, current, createdAt, lastSeenAt, expiresAt]
      properties:
        id:
          type: string
        current:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        ip:
          type: string
        userAgent:
          type: string
        accountId:
          type: string
        method:
          type: string
          description: How the session was established (password or sso)
    Membership:
      type: object
      required: [accountId, role]
      properties:
        accountId:
          type: string
        role:
          type: string
          enum: [viewer, editor, admin]
    ConsoleUser:
      type: object
      required: [username, displayName, role, accounts, memberships, platformAdmin]
      properties:
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [viewer, editor, admin]
        accounts:
          type: array
          items:
            type: string
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        platformAdmin:
          type: boolean
    UpsertUserRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          description: 1-64 letters, digits, dots, dashes, underscores or @
        displayName:
          type: string
          maxLength: 100
          description: Defaults to the username
        role:
          type: string
          enum: [viewer, editor, admin]
        password:
          type: string
          description: Required for a new user; 8-1024 characters
        accounts:
          type: array
          items:
            type: string
        platformAdmin:
          type: boolean
          description: Platform admins only
    Account:
      type: object
      required: [accountId, name, createdAt]
      properties:
        accountId:
          type: string
        name:
          type: string
        createdAt:
          type: string
    UserAccountRequest:
      type: object
      required: [username, accountId]
      properties:
        username:
          type: string
        accountId:
          type: string
        role:
          type: string
          enum: [viewer, editor, admin]
          description: Defaults to viewer
    OrgSettings:
      type: object
      required: [approvalEnvironments, approvalMinApprovers, sessionIdleMinutes, sessionMaxHours]
      properties:
        approvalEnvironments:
          type: array
          description: Environment slugs whose changes require an approved change request
          items:
            type: string
        approvalMinApprovers:
          type: integer
          minimum: 1
          maximum: 10
        sessionIdleMinutes:
          type: integer
          minimum: 5
          maximum: 1440
        sessionMaxHours:
          type: integer
          minimum: 1
          maximum: 720
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
    IamOidcProvider:
      type: object
      required: [providerArn, url, clientIds, createdAt]
      properties:
        providerArn:
          type: string
        url:
          type: string
        clientIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    IamTrustPolicy:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [oidc, account]
        providerUrl:
          type: string
          description: OIDC trust only
        audiences:
          type: array
          description: OIDC trust only
          items:
            type: string
        subjects:
          type: array
          description: OIDC trust only; a trailing * matches a prefix
          items:
            type: string
        principals:
          type: array
          description: Account trust only; 12-digit account IDs
          items:
            type: string
    IamRole:
      type: object
      required: [roleArn, roleName, description, trust, maxSessionSeconds, createdAt, updatedAt]
      properties:
        roleArn:
          type: string
        roleName:
          type: string
        description:
          type: string
        trust:
          $ref: "#/components/schemas/IamTrustPolicy"
        maxSessionSeconds:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IamRoleInput:
      type: object
      required: [roleName, trust]
      properties:
        roleName:
          type: string
          maxLength: 64
        description:
          type: string
        trust:
          $ref: "#/components/schemas/IamTrustPolicy"
        maxSessionSeconds:
          type: integer
          description: Defaults to 3600; clamped to 900-43200
    SsoRoleMapping:
      type: object
      required: [group, accountId, role]
      properties:
        group:
          type: string
        accountId:
          type: string
          description: An account ID, or * for every account
        role:
          type: string
          enum: [viewer, editor, admin]
    SsoProvider:
      type: object
      required: [id, name, issuer, clientId, clientSecretSet, scopes, groupClaim, roleMappings, defaultRole, enabled, redirectUri, accountId, allowedEmailDomains, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        issuer:
          type: string
        clientId:
          type: string
        clientSecretSet:
          type: boolean
        scopes:
          type: array
          items:
            type: string
        groupClaim:
          type: string
        roleMappings:
          type: array
          items:
            $ref: "#/components/schemas/SsoRoleMapping"
        defaultRole:
          type: string
          enum: [none, viewer, editor, admin]
        enabled:
          type: boolean
        redirectUri:
          type: string
        accountId:
          type: string
        allowedEmailDomains:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SsoProviderInput:
      type: object
      required: [name, issuer, clientId]
      properties:
        id:
          type: string
          description: Required on update; ignored on create
        name:
          type: string
          maxLength: 100
        issuer:
          type: string
          description: https issuer URL without query or fragment
        clientId:
          type: string
          maxLength: 256
        clientSecret:
          type: string
          maxLength: 1024
          description: Required on create; omit on update to keep the stored secret
        scopes:
          type: array
          maxItems: 20
          items:
            type: string
        groupClaim:
          type: string
        roleMappings:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SsoRoleMapping"
        defaultRole:
          type: string
          enum: [none, viewer, editor, admin]
        enabled:
          type: boolean
        allowedEmailDomains:
          type: array
          maxItems: 50
          items:
            type: string
    WorkloadTokenRequest:
      type: object
      required: [clientId, audience]
      properties:
        clientId:
          type: string
        audience:
          type: string
          description: Must be one of the client's audiences
        kubernetesToken:
          type: string
          description: Service account token for k8s-token-review clients
        ttlSeconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: 0 or omitted uses the client's tokenTtlSeconds
    WorkloadToken:
      type: object
      required: [token, expiresAt, tokenType]
      properties:
        token:
          type: string
          description: Signed JWT
        expiresAt:
          type: string
          format: date-time
        tokenType:
          type: string
          enum: [id_token]
    WorkloadSigningKey:
      type: object
      required: [kid, kmsKeyId, algorithm, activatedAt]
      properties:
        kid:
          type: string
        kmsKeyId:
          type: string
        algorithm:
          type: string
        activatedAt:
          type: string
          format: date-time
    WorkloadRetiredKey:
      type: object
      required: [kid, kmsKeyId, algorithm, retiredAt, unpublishAt]
      properties:
        kid:
          type: string
        kmsKeyId:
          type: string
        algorithm:
          type: string
        retiredAt:
          type: string
          format: date-time
        unpublishAt:
          type: string
          format: date-time
    WorkloadIssuer:
      type: object
      required: [issuer, discoveryUrl, jwksUrl, tokenEndpoint, signingKey, previousKeys, rotationDays, algorithm, configured, k8sTokenReview]
      properties:
        issuer:
          type: string
          description: Empty when KMS_PUBLIC_URL is not set
        discoveryUrl:
          type: string
        jwksUrl:
          type: string
        tokenEndpoint:
          type: string
        signingKey:
          description: The active signing key, or null before the first token
          oneOf:
            - $ref: "#/components/schemas/WorkloadSigningKey"
            - type: "null"
        previousKeys:
          type: array
          items:
            $ref: "#/components/schemas/WorkloadRetiredKey"
        rotationDays:
          type: integer
        algorithm:
          type: string
        configured:
          type: boolean
        k8sTokenReview:
          type: boolean
          description: Whether k8s-token-review clients can be created on this server
        nextRotationAt:
          type: string
          format: date-time
    WorkloadClientAuth:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [access-key, k8s-token-review]
        allowedUsers:
          type: array
          description: access-key clients only
          items:
            type: string
        apiServer:
          type: string
          description: k8s-token-review clients only
        caPem:
          type: string
          description: k8s-token-review clients only
        serviceAccounts:
          type: array
          description: k8s-token-review clients only, as namespace:name
          items:
            type: string
        reviewAudience:
          type: string
          description: k8s-token-review clients only
    WorkloadClient:
      type: object
      required: [clientId, name, audiences, tokenTtlSeconds, subjectFormat, auth]
      properties:
        clientId:
          type: string
          description: Assigned by the server; empty on create, required on update
        name:
          type: string
        audiences:
          type: array
          items:
            type: string
        tokenTtlSeconds:
          type: integer
          minimum: 60
          maximum: 3600
        subjectFormat:
          type: string
          description: Template for the token subject, e.g. "{name}:{username}"
        auth:
          $ref: "#/components/schemas/WorkloadClientAuth"
        createdAt:
          type: string
          format: date-time
          description: Output only
        updatedAt:
          type: string
          format: date-time
          description: Output only
        lastIssuedAt:
          type: string
          format: date-time
          description: Output only
    Project:
      type: object
      required: [slug, environments, environmentCounts]
      properties:
        slug:
          type: string
          description: Project slug
        name:
          type: string
          description: Display name, when set via renameProject
        environments:
          type: array
          items:
            type: string
          description: Environment slugs
        environmentCounts:
          type: object
          description: Live secrets per environment (at any depth), keyed by environment slug
          additionalProperties:
            type: integer
    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    CreateProjectRequest:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
          description: Project slug
        name:
          type: string
          description: Optional display name
    CreateEnvironmentRequest:
      type: object
      required: [project, slug]
      properties:
        project:
          type: string
          description: Project slug
        slug:
          type: string
          description: Environment slug
        name:
          type: string
          description: Optional display name
    CreateFolderRequest:
      type: object
      required: [project, env, path]
      properties:
        project:
          type: string
          description: Project slug
        env:
          type: string
          description: Environment slug
        path:
          type: string
          description: Folder path, e.g. /db/primary
    RenameRequest:
      type: object
      description: "Renames a display name; slugs never change."
      required: [slug, name]
      properties:
        project:
          type: string
          description: Project slug (environments only)
        slug:
          type: string
          description: Slug of the project, or of the environment, being renamed
        name:
          type: string
          description: New display name
    ProjectMutationResult:
      type: object
      description: Echo of the affected structure with one of created, renamed or deleted set to true.
      properties:
        slug:
          type: string
        project:
          type: string
        env:
          type: string
        path:
          type: string
        created:
          type: boolean
        renamed:
          type: boolean
        deleted:
          type: boolean
    SecretItem:
      type: object
      required: [project, env, path, key, arn, updatedAt, tags]
      properties:
        project:
          type: string
        env:
          type: string
        path:
          type: string
          description: Folder path, / for the root
        key:
          type: string
        arn:
          type: string
          description: ARN of the backing Secrets Manager secret
        updatedAt:
          type: string
          format: date-time
        deletionDate:
          type: string
          description: Set when the item is scheduled for deletion
          format: date-time
        version:
          type: integer
          description: Number of stored versions (the newest version's ordinal)
        updatedBy:
          type: string
          description: Principal that wrote the newest version
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        rotationDue:
          type: boolean
          description: A rotation schedule has come due (Citadel records schedules but does not run rotation functions)
    SecretListing:
      type: object
      required: [project, env, path, folders, items, shadowed, folderCounts]
      properties:
        project:
          type: string
        env:
          type: string
        path:
          type: string
          description: Normalised folder path
        folders:
          type: array
          items:
            type: string
          description: Names of the immediate subfolders
        items:
          type: array
          items:
            $ref: "#/components/schemas/SecretItem"
          description: Items directly in this folder (values never included)
        shadowed:
          type: array
          items:
            $ref: "#/components/schemas/SecretItem"
          description: "Objects whose name equals a subfolder's own name, shadowing its JSON projection; remove with deleteShadowingSecret"
        folderCounts:
          type: object
          description: Live items at or below each subfolder
          additionalProperties:
            type: integer
    PutSecretRequest:
      type: object
      required: [project, env, key, value]
      properties:
        project:
          type: string
          description: Project slug
        env:
          type: string
          description: Environment slug
