            $ref: "#/components/responses/InternalError"
    /v1/workload-identity/token:
      post:
        operationId: issueWorkloadToken
        tags: [Workload identity]
        summary: Issue a workload identity token
        description: |
          Mints a signed OIDC ID token (JWT) for a workload identity client. The
          body is JSON (unknown members rejected). The workload authenticates by
          the client's method:
          - access-key clients: `Authorization: Bearer <accessKeyId>:<secret>` of a
            user listed in the client's allowedUsers, or an AWS SigV4-signed
            request with such a user's key. STS temporary keys are refused.
          - k8s-token-review clients: a Kubernetes service account token in
            kubernetesToken (or as the bearer token), checked with TokenReview.
          ttlSeconds 0 or omitted uses the client's tokenTtlSeconds; the maximum
          is 3600. Errors use the standard {error, message} shape with OAuth-style
          codes: invalid_request (400), invalid_target (400, audience not allowed),
          invalid_client (401, unknown client or failed authentication, with
          WWW-Authenticate), access_denied (403), rate_limited (429, Retry-After),
          not_configured (503, KMS_PUBLIC_URL unset), server_error (500). Rate
          limited per client address and per client. The response has
          Cache-Control no-store. The OAuth-style endpoint at /oidc/token offers
          the same issuance with snake_case members.
        x-citadel-role: public
        x-citadel-audit: citadel.IssueWorkloadToken
        security:
          - bearerAccessKey: []
          - {}
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadTokenRequest"
        responses:
          "200":
            description: The token
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/WorkloadToken"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "413":
            description: Request body larger than 64 KiB
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
          "429":
            $ref: "#/components/responses/TooManyRequests"
          "500":
            $ref: "#/components/responses/InternalError"
          "503":
            description: Workload identity is not configured (KMS_PUBLIC_URL unset)
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
    /v1/workload-identity/issuer:
      get:
        operationId: getWorkloadIssuer
        tags: [Workload identity]
        summary: Get the workload identity issuer
        description: The issuer URL, discovery and JWKS URLs, the current and recently retired signing keys and rotation settings.
        x-citadel-role: viewer
        responses:
          "200":
            description: The issuer
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/WorkloadIssuer"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/workload-identity/issuer/settings:
      post:
        operationId: putWorkloadIssuerSettings
        tags: [Workload identity]
        summary: Change the issuer's signing algorithm and rotation period
        description: |
          Platform admins with a console session only (the issuer is shared by
          every account). A new algorithm takes effect at once by rotating to a
          key of that type (also audited as citadel.RotateWorkloadSigningKey).
        x-citadel-role: platform-admin
        x-citadel-audit: [citadel.UpdateWorkloadIssuerSettings, citadel.RotateWorkloadSigningKey]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [algorithm, rotationDays]
                properties:
                  algorithm:
                    type: string
                    enum: [ES256, ES384, RS256, PS256]
                  rotationDays:
                    type: integer
                    minimum: 7
                    maximum: 365
        responses:
          "200":
            description: The issuer after the change
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/WorkloadIssuer"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/workload-identity/issuer/rotate:
      post:
        operationId: rotateWorkloadSigningKey
        tags: [Workload identity]
        summary: Rotate the issuer's signing key now
        description: |
          Platform admins with a console session only. The retired key stays
          published in the JWKS until its unpublishAt. 409 `conflict` when the
          key changed concurrently.
        x-citadel-role: platform-admin
        x-citadel-audit: citadel.RotateWorkloadSigningKey
        responses:
          "200":
            description: The issuer after rotation
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/WorkloadIssuer"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/workload-identity/clients:
      get:
        operationId: listWorkloadClients
        tags: [Workload identity]
        summary: List the account's workload identity clients
        x-citadel-role: viewer
        responses:
          "200":
            description: The clients
            content:
              application/json:
                schema:
                  type: object
                  required: [clients]
                  properties:
                    clients:
                      type: array
                      items:
                        $ref: "#/components/schemas/WorkloadClient"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
      post:
        operationId: createWorkloadClient
        tags: [Workload identity]
        summary: Create a workload identity client
        description: |
          clientId is assigned by the server (must be empty). 1-10 audiences,
          tokenTtlSeconds 60-3600. subjectFormat placeholders: for access-key
          clients {clientId}, {name}, {accountId}, {username}, {accessKeyId}; for
          k8s-token-review clients {clientId}, {name}, {accountId}, {namespace},
          {serviceAccount}, {podName}. access-key clients need 1-100 allowedUsers
          who are members of the account; k8s-token-review clients need apiServer
          (https), a dedicated reviewAudience and 1-100 serviceAccounts as
          `namespace:name`, and the server must have TokenReview configured.
          409 `name_taken` when the name is in use in the account.
        x-citadel-role: admin
        x-citadel-audit: citadel.CreateWorkloadClient
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadClient"
        responses:
          "201":
            description: Created
            content:
              application/json:
                schema:
                  type: object
                  required: [clientId]
                  properties:
                    clientId:
                      type: string
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
      delete:
        operationId: deleteWorkloadClient
        tags: [Workload identity]
        summary: Delete a workload identity client
        x-citadel-role: admin
        x-citadel-audit: citadel.DeleteWorkloadClient
        parameters:
          - name: clientId
            in: query
            required: true
            schema:
              type: string
        responses:
          "200":
            description: Deleted
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/DeletedFlag"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/workload-identity/clients/update:
      post:
