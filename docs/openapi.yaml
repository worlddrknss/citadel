          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
      delete:
        operationId: cancelSecretRotation
        tags: [Secrets]
        summary: Disable an item's rotation
        x-citadel-role: editor
        x-citadel-audit: citadel.CancelItemRotation
        parameters:
          - name: project
            in: query
            required: true
            description: Project slug
            schema:
              type: string
          - name: env
            in: query
            required: true
            description: Environment slug
            schema:
              type: string
          - name: path
            in: query
            description: "Folder path below the environment, e.g. /db/primary (default: root)"
            schema:
              type: string
          - name: key
            in: query
            required: true
            description: Item key
            schema:
              type: string
        responses:
          "200":
            description: Cancelled
            content:
              application/json:
                schema:
                  type: object
                  required: [cancelled]
                  properties:
                    cancelled:
                      type: boolean
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/secrets/bulk:
      post:
        operationId: bulkSecrets
        tags: [Secrets]
        summary: Apply one action to several keys of a folder
        description: |
          Actions, each over at most 500 keys of one folder:
          - delete: schedule deletion (force, recoveryWindowDays apply).
          - restore: cancel pending deletions; 409 `approval_required` in an approval environment.
          - copy: copy current values with description, KMS key and tags to targetEnv/targetPath; existing target keys fail unless overwrite. Into an approval environment one change request per key is opened instead (ids in changeRequests).
          - move: rename within the environment to targetPath, keeping history, tags and policy; 409 `approval_required` in an approval environment.
          Per-key failures are reported in failed rather than failing the request.
        x-citadel-role: editor
        x-citadel-audit:
          - "citadel.Bulk:delete"
          - "citadel.Bulk:restore"
          - citadel.BulkCopy
          - citadel.BulkMove
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkSecretsRequest"
        responses:
          "200":
            description: Per-key outcome
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/BulkSecretsResult"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/secrets/summary:
      get:
        operationId: getSecretsSummary
        tags: [Secrets]
        summary: Count items, projects and environments
        x-citadel-role: viewer
        responses:
