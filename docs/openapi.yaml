      post:
        operationId: putSecretSettings
        tags: [Secrets]
        summary: Update the account's secrets settings
        x-citadel-role: admin
        x-citadel-audit: citadel.UpdateSecretSettings
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutSecretSettingsRequest"
        responses:
          "200":
            description: Saved settings
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/SecretSettings"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/change-requests:
      get:
        operationId: listChangeRequests
        tags: [Change requests]
        summary: List change requests
        description: Pending requests also carry approvals, approvalsRequired, approverRoles and whether the caller may approve. Not paginated.
        x-citadel-role: viewer
        responses:
          "200":
            description: Change requests in the caller's account
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ChangeRequestList"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
      post:
        operationId: createChangeRequest
        tags: [Change requests]
        summary: Propose a value for approval
        description: Records a proposed write to one item, held until enough distinct approvers sign off. The value is sealed under the account default KMS key until applied. Access keys may propose changes.
        x-citadel-role: editor
        x-citadel-audit: citadel.CreateChangeRequest
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateChangeRequestRequest"
        responses:
          "200":
            description: The new request
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ChangeRequestSummary"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/change-requests/detail:
      get:
        operationId: getChangeRequest
        tags: [Change requests]
        summary: Get a change request
        description: Includes keyed fingerprints and lengths of the previous and proposed values (never the values), the applicable policy, approvals so far, and whether the caller may approve or reject.
        x-citadel-role: viewer
        parameters:
          - name: id
            in: query
            required: true
            description: Change request id
            schema:
              type: string
        responses:
          "200":
            description: The request
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ChangeRequestDetail"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/change-requests/values:
      get:
        operationId: getChangeRequestValues
        tags: [Change requests]
        summary: Reveal a change request's values
        description: Decrypts the proposed value (and the value it replaces) for review. Audited.
        x-citadel-role: editor
        x-citadel-audit: citadel.RevealChangeRequest
        parameters:
          - name: id
            in: query
            required: true
            description: Change request id
            schema:
              type: string
        responses:
          "200":
            description: Previous and proposed values
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ChangeRequestValues"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/change-requests/approve:
      post:
        operationId: approveChangeRequest
        tags: [Change requests]
        summary: Approve a change request
        description: "The requester can never approve their own request, approvals require a console session (not an access key), and the approver's role must meet one of the policy's approverRoles (403 otherwise). On the final required approval the value is written; if writing fails the request returns to pending (500 `apply_failed`). 409 `already_decided` or `already_approved`."
        x-citadel-role: editor
        x-citadel-audit: [citadel.ApproveChangeRequest, citadel.ApplyChangeRequest]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequestDecisionRequest"
        responses:
          "200":
            description: "Approval recorded; applied once enough approvals are in"
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ApproveChangeRequestResult"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/change-requests/reject:
      post:
        operationId: rejectChangeRequest
        tags: [Change requests]
        summary: Reject or withdraw a change request
        description: "Approvers (per the policy) may reject; the requester may withdraw their own request. 409 `already_decided`."
        x-citadel-role: editor
        x-citadel-audit: citadel.RejectChangeRequest
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequestDecisionRequest"
        responses:
          "200":
            description: Rejected
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/RejectChangeRequestResult"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/change-requests/policies:
      get:
        operationId: listApprovalPolicies
        tags: [Change requests]
        summary: List approval policies
        x-citadel-role: viewer
        responses:
          "200":
            description: Explicit policies plus environments covered by the organization default
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ApprovalPolicyList"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
      post:
        operationId: putApprovalPolicy
        tags: [Change requests]
        summary: Create, replace or remove an approval policy
        description: approvalsRequired 0 removes the environment's policy. approverRoles may contain admin and editor (default admin).
        x-citadel-role: admin
        x-citadel-audit: citadel.PutApprovalPolicy
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutApprovalPolicyRequest"
        responses:
          "200":
            description: Saved
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/SavedResult"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/parameters:
      get:
        operationId: listParameters
        tags: [Parameters]
        summary: List every parameter in the account
        description: |
          Returns all parameters for the caller's account in one response (no
          pagination); the console builds the folder tree from the slash-style
          names. String and StringList values are included inline; SecureString
          values are never listed (use getParameterValue). `limits` carries the
          name rules the server enforces for this account.
        x-citadel-role: viewer
        responses:
          "200":
            description: The account's parameters
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ParameterList"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
          "501":
            description: The active store has no parameter store (`unsupported`)
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
      post:
        operationId: putParameter
        tags: [Parameters]
        summary: Create or overwrite a parameter
        description: |
          Creates a parameter, or replaces it when `overwrite` is true (409
          `already_exists` otherwise). SecureString values are encrypted with
          `kmsKeyId`, or the account default key when empty. Values are limited to
          4096 bytes (Standard) or 8192 bytes (Advanced).
        x-citadel-role: editor
        x-citadel-audit: citadel.PutParameter
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParameterPutRequest"
        responses:
          "200":
            description: The saved parameter
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ParameterEnvelope"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
          "501":
            description: The active store has no parameter store (`unsupported`)
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"
      delete:
        operationId: deleteParameter
        tags: [Parameters]
        summary: Delete a parameter and its history
        x-citadel-role: editor
        x-citadel-audit: citadel.DeleteParameter
        parameters:
          - name: name
            in: query
            required: true
            description: The parameter name
            schema:
              type: string
        responses:
          "200":
            description: The parameter was deleted
            content:
              application/json:
                schema:
                  type: object
                  required: [deleted]
                  properties:
                    deleted:
                      type: string
                      description: The canonical name of the deleted parameter
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/parameters/value:
      get:
        operationId: getParameterValue
        tags: [Parameters]
        summary: Read a parameter's value
        description: |
          Returns the decrypted value of the current version, or of `version`.
          For SecureString parameters viewers may read the value only when the
          account's viewersCanReveal setting allows it (403 `reveal_forbidden`).
        x-citadel-role: viewer
        x-citadel-audit: citadel.GetParameter
        parameters:
          - name: name
            in: query
            required: true
            schema:
              type: string
          - name: version
            in: query
            required: false
            description: A specific version number (1 or greater)
            schema:
              type: integer
              minimum: 1
        responses:
          "200":
            description: The parameter and its plaintext value
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ParameterValue"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/parameters/history:
      get:
        operationId: getParameterHistory
        tags: [Parameters]
        summary: List a parameter's versions
        description: Version metadata only; values are not included.
        x-citadel-role: viewer
        parameters:
          - name: name
            in: query
            required: true
            schema:
              type: string
        responses:
          "200":
            description: The version history
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ParameterHistory"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/parameters/tags:
      get:
        operationId: listParameterTags
        tags: [Parameters]
        summary: List a parameter's tags
        x-citadel-role: viewer
        parameters:
          - name: name
            in: query
            required: true
            schema:
              type: string
        responses:
          "200":
            description: The parameter's tags
            content:
              application/json:
                schema:
                  type: object
                  required: [name, tags]
                  properties:
                    name:
                      type: string
                    tags:
                      type: array
                      items:
                        $ref: "#/components/schemas/Tag"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
      post:
        operationId: tagParameter
        tags: [Parameters]
        summary: Add or update tags on a parameter
        description: Tags with an empty key are ignored.
        x-citadel-role: editor
        x-citadel-audit: citadel.TagParameter
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParameterTagRequest"
        responses:
          "200":
            description: Tags saved
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ParameterNameResult"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
      delete:
        operationId: untagParameter
        tags: [Parameters]
        summary: Remove tags from a parameter
        x-citadel-role: editor
        x-citadel-audit: citadel.UntagParameter
        parameters:
          - name: name
            in: query
            required: true
            schema:
              type: string
          - name: keys
            in: query
            required: true
            description: Comma-separated tag keys to remove
            schema:
              type: string
        responses:
          "200":
            description: Tags removed
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ParameterNameResult"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/parameters/label:
      post:
        operationId: labelParameterVersion
        tags: [Parameters]
        summary: Attach labels to a parameter version
        description: |
          1 to 10 labels; each is letters, digits, period, dash or underscore, at
          most 100 characters, and must not start with a digit, `aws` or `ssm`.
        x-citadel-role: editor
        x-citadel-audit: citadel.LabelParameterVersion
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParameterLabelRequest"
        responses:
          "200":
            description: The labels now on the version
            content:
              application/json:
                schema:
                  type: object
                  required: [name, labels]
                  properties:
                    name:
                      type: string
                    labels:
                      type: array
                      items:
                        type: string
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
      delete:
        operationId: unlabelParameterVersion
        tags: [Parameters]
        summary: Remove labels from a parameter version
        x-citadel-role: editor
        x-citadel-audit: citadel.UnlabelParameterVersion
        parameters:
          - name: name
            in: query
            required: true
            schema:
              type: string
          - name: version
            in: query
            required: true
            schema:
              type: integer
              minimum: 1
          - name: labels
            in: query
            required: true
            description: Comma-separated labels to remove
            schema:
              type: string
        responses:
          "200":
            description: The labels that were removed
            content:
              application/json:
                schema:
                  type: object
                  required: [name, removed]
                  properties:
                    name:
                      type: string
                    removed:
                      type: array
                      items:
                        type: string
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/parameters/update:
      post:
        operationId: updateParameter
        tags: [Parameters]
        summary: Edit a parameter with optimistic concurrency
        description: |
          Writes a new version when `expectedVersion` matches the current one
          (409 `version_conflict` otherwise). Omitted fields keep their current
          values; omitting `value` keeps the current value, re-encrypted when the
          type or KMS key changes. An Advanced parameter cannot move back to the
          Standard tier.
        x-citadel-role: editor
        x-citadel-audit: citadel.PutParameter
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParameterUpdateRequest"
        responses:
          "200":
            description: The saved parameter
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ParameterEnvelope"
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
          "500":
            $ref: "#/components/responses/InternalError"
    /v1/kms/keys:
      get:
        operationId: listKmsKeys
        tags: [KMS]
        summary: List the account's KMS keys
        description: Returns every key in one response (no pagination).
        x-citadel-role: viewer
        responses:
          "200":
            description: The keys
            content:
              application/json:
                schema:
                  type: object
                  required: [keys]
                  properties:
                    keys:
                      type: array
                      items:
                        $ref: "#/components/schemas/KmsKey"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "500":
            $ref: "#/components/responses/InternalError"
      post:
        operationId: createKmsKey
        tags: [KMS]
        summary: Create a KMS key
        description: |
          `keyUsage` defaults to ENCRYPT_DECRYPT and `keySpec` to SYMMETRIC_DEFAULT.
          Errors are reported as 400 `create_failed`.
        x-citadel-role: editor
        x-citadel-audit: citadel.CreateKey
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsCreateKeyRequest"
        responses:
          "200":
            description: The new key
            content:
              application/json:
                schema:
                  type: object
                  required: [keyId, arn, created]
                  properties:
                    keyId:
                      type: string
                    arn:
                      type: string
                    created:
                      type: boolean
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
    /v1/kms/keys/enabled:
      post:
        operationId: setKmsKeyEnabled
        tags: [KMS]
        summary: Enable or disable a KMS key
        x-citadel-role: editor
        x-citadel-audit: [citadel.EnableKey, citadel.DisableKey]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsSetEnabledRequest"
        responses:
          "200":
            description: The key's new state
            content:
              application/json:
                schema:
                  type: object
                  required: [keyId, enabled]
                  properties:
                    keyId:
                      type: string
                    enabled:
                      type: boolean
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
    /v1/kms/keys/schedule-deletion:
      post:
        operationId: scheduleKmsKeyDeletion
        tags: [KMS]
        summary: Schedule a KMS key for deletion
        description: "`windowDays` defaults to 30."
        x-citadel-role: admin
        x-citadel-audit: citadel.ScheduleKeyDeletion
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KmsScheduleDeletionRequest"
        responses:
          "200":
            description: The scheduled deletion date
            content:
              application/json:
                schema:
                  type: object
                  required: [keyId, deletionDate]
                  properties:
                    keyId:
                      type: string
                    deletionDate:
                      type: string
                      format: date-time
          "400":
            $ref: "#/components/responses/BadRequest"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
    /v1/kms/keys/cancel-deletion:
      post:
        operationId: cancelKmsKeyDeletion
        tags: [KMS]
        summary: Cancel a pending KMS key deletion
        x-citadel-role: admin
        x-citadel-audit: citadel.CancelKeyDeletion
