apiVersion: v2
name: citadel
description: >-
  Citadel, a self-hosted key management, secrets, parameter store and PKI
  service with AWS-compatible APIs (KMS, Secrets Manager, SSM, ACM, ACM PCA, STS).
type: application
# Chart version. Bump on every change to the chart itself.
version: 0.1.0
# The Citadel release this chart was written for. It is the default image tag
# (ghcr.io/worlddrknss/citadel:<appVersion>); release images are tagged with
# the bare semver version, without the leading "v".
appVersion: "2.0.0"
kubeVersion: ">=1.27.0-0"
home: https://github.com/worlddrknss/citadel
sources:
  - https://github.com/worlddrknss/citadel
icon: https://raw.githubusercontent.com/worlddrknss/citadel/main/assets/image.png
keywords:
  - kms
  - secrets
  - pki
  - acme
  - fips
maintainers:
  - name: worlddrknss
    url: https://github.com/worlddrknss
