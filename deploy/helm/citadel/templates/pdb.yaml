{{- if and .Values.podDisruptionBudget.enabled (not .Values.devMode.inMemory) (or .Values.autoscaling.enabled (gt (int .Values.replicaCount) 1)) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "citadel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "citadel.labels" . | nindent 4 }}
spec:
  {{- if not (kindIs "invalid" .Values.podDisruptionBudget.minAvailable) }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "citadel.selectorLabels" . | nindent 6 }}
{{- end }}
