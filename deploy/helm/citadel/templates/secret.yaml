{{- if and .Values.secrets.create (include "citadel.hasInlineSecrets" .) }}
# Rendered only because secrets.create=true. Prefer an externally managed
# Secret (secrets.existingSecret) in production.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "citadel.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "citadel.labels" . | nindent 4 }}
  {{- if .Values.secrets.keep }}
  annotations:
    # Keeps the wrapping key when the release is uninstalled.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{- range (include "citadel.secretSpecs" . | fromYamlArray) }}
  {{- $entry := index $.Values.secrets .name | default dict }}
  {{- if and $entry.value (not $entry.existingSecret) }}
  {{ .env }}: {{ $entry.value | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
