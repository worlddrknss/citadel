{{- if .Values.workloadIdentity.kubernetes.tokenReview }}
# Lets Citadel call the TokenReview API to verify Kubernetes service account
# tokens presented for workload identity. system:auth-delegator grants only
# tokenreviews and subjectaccessreviews create.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-auth-delegator" .Release.Namespace (include "citadel.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "citadel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "citadel.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
