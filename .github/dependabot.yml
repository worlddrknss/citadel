version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns: ["github.com/aws/*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      svelte:
        patterns: ["svelte", "svelte-check", "@sveltejs/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
