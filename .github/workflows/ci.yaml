name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # At least 14 characters: under FIPS mode the PostgreSQL driver uses
          # the password as an HMAC key and rejects shorter ones.
          POSTGRES_PASSWORD: citadel-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Postgres-backed store tests run against this; they skip when unset.
      CITADEL_TEST_DB_URL: postgres://postgres:citadel-ci-password@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      # Production runs the Go Cryptographic Module with GODEBUG=fips140=only
      # (FIPS 140-3), where non-approved algorithms panic. Tests run the same
      # way so a non-approved primitive fails CI rather than a deployment.
      - name: go test (FIPS 140-only)
        env:
          GOFIPS140: latest
          GODEBUG: fips140=only
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test --if-present
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Builds the SPA, serves it with vite preview and mocks the /v1 API.
      - name: End-to-end smoke tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

  # The console driven through a browser against the real server binary and
  # a fresh Postgres: first-run bootstrap, secrets, approvals, audit, PKI,
  # IAM, workload identity, KMS, account and admin flows. Nothing is mocked.
  e2e-live:
    runs-on: ubuntu-latest
    needs: [go, web]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: citadel-live-e2e-pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # start-server.sh skips its own Docker database when this is set.
      CITADEL_LIVE_DB_URL: postgres://postgres:citadel-live-e2e-pw@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Builds the console and the server (FIPS module), starts it in
      # bootstrap mode and runs web/e2e-live in order.
      - name: Live end-to-end tests
        run: npm run test:e2e:live
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: |
            web/playwright-report-live/
            web/test-results-live/
            web/e2e-live/.run/server.log
          retention-days: 14

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      # helm lint, helm template with every deploy/helm/citadel/ci values
      # file, kubeconform on the output, and the refused-values checks.
      - name: Lint and validate the Helm chart
        env:
          KUBECONFORM: docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7-alpine
        run: deploy/helm/validate.sh
      - name: Validate the Compose file
        run: docker compose -f deploy/compose/docker-compose.yaml --env-file deploy/compose/.env.example config --quiet

  image:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
