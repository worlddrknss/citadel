name: Release Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  # Keyless image signing (Sigstore) and build provenance attestations.
  id-token: write
  attestations: write

jobs:
  # The Helm chart's appVersion is the default image tag, so a release whose
  # chart still names the previous version would install the old image, and
  # the SDKs report their version in User-Agent. Fails the release (nothing
  # is built or pushed) until Chart.yaml and the SDK versions are bumped in
  # the release pull request; this workflow never commits to main.
  chart-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Chart appVersion matches the tag
        run: scripts/check-chart-version.sh "$GITHUB_REF_NAME"
      - name: SDK versions match the tag
        run: scripts/check-sdk-version.sh "$GITHUB_REF_NAME"

  build-and-push:
    runs-on: ubuntu-latest
    needs: chart-version

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/citadel
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          provenance: mode=max
          sbom: true
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do cosign sign --yes "${tag}@${DIGEST}"; done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/citadel
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
